# Render Blueprint — 無料枠で Catcheez バックエンドを公開
# 使い方: GitHub に push → Render で "New +" → "Blueprint" → このリポジトリを選択 → Apply
services:
  - type: web
    name: catcheez-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true        # 自動で安全な値を生成
      - key: ALLOW_ADMIN
        value: "false"             # 公開時は管理/テスト用エンドポイントを無効化
      - key: NODE_VERSION
        value: "20"
